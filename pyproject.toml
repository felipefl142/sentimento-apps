[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentimento-apps"
version = "0.1.0"
description = "Sentimento de reviews pt-BR da Google Play (Nubank, iFood, Mercado Livre, gov.br, WhatsApp) - DuckDB + MLflow + Streamlit"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "mlartifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
